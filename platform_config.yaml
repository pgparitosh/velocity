# Velocity Platform Configuration
environment: dev

llm:
  default_provider: groq
  default_model: openai/gpt-oss-120b
  providers:
    groq:
      api_key_env: GROQ_API_KEY
      models: [openai/gpt-oss-120b]

infra:
  cache:
    backend: memory
  database:
    backend: sqlite
  object_store:
    backend: local

# Development Observability
observability:
  dev_logging:
    enabled: true          # Enable dev console logging (default: true in dev environment)
    verbose: false         # Show detailed inputs/outputs (default: false)