# Showcase Agent Configuration - Demonstrates All Platform Features
# This agent showcases: memory, security, rate limiting, budgeting, tool registry,
# audit logging, cost tracking, and multi-turn conversations

agent_id: "showcase-agent"
version: "1.0.0"
description: "Comprehensive agent demonstrating all Velocity platform capabilities"

# LLM Configuration
model: "gemini-1.5-flash"  # Using Google's model for variety
max_tokens: 2048
temperature: 0.7
max_iterations: 10

# Cost Management & Budgeting
budget:
  daily_limit_usd: 10.0
  monthly_limit_usd: 200.0
  per_request_limit_usd: 0.50
  alert_threshold_pct: 0.80

# Rate Limiting (3-level protection)
rate_limits:
  requests_per_minute: 20
  requests_per_hour: 200
  burst_multiplier: 1.5

# Security Features
security:
  detect_pii: true          # Enable PII detection in inputs/outputs
  block_injection: true     # Prevent prompt injection attacks
  mask_output: true         # Mask PII in responses
  require_permissions: true # Enforce RBAC on tools

# Memory Management (all three types)
memory:
  use_short_term: true      # Conversation context across turns
  use_long_term: true       # Semantic knowledge retrieval
  use_episodic: true        # Past interaction patterns
  short_term_ttl_s: 1800    # 30 minutes
  max_context_tokens: 3000

# Tool Permissions (RBAC demonstration)
permissions:
  - time.read                # Basic time operations
  - data.read                # Data retrieval
  - calculation.execute      # Mathematical operations
  - external.api             # External API calls
  - admin.system             # System-level operations

# Audit & Observability
audit:
  enabled: true
  log_level: "detailed"

# Validation Schemas
input_schema:
  type: object
  properties:
    query:
      type: string
      minLength: 1
      description: "The user's query or request"
    session_id:
      type: string
      description: "Optional session identifier for continuity"
  required: ["query"]

output_schema:
  type: object
  properties:
    response:
      type: string
      description: "The agent's response"
    actions_taken:
      type: array
      items:
        type: string
      description: "Tools or actions executed"
    confidence:
      type: number
      minimum: 0
      maximum: 1
  required: ["response"]

# Orchestration (for future multi-agent workflows)
orchestration:
  enabled: false  # Single agent for now

# Eval Framework
eval:
  enabled: true
  pass_threshold: 0.85